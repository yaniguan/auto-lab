name: tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/tests.yml
      - name: Install autolab-hub and test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit and catalog integrity tests
        run: python -m pytest -q

  lean-trust-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache Lean 4 toolchain and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            lean/.lake
          key: lean4-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}
      - name: Install elan and build AutoLabLean (zero sorry)
        run: |
          if [ ! -x "$HOME/.elan/bin/lake" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          lake build
          lake exe autolab-lean
      - name: Verify Python <-> Lean 4 kernel parity & zero-sorry audit
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
