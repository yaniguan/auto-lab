<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="64" height="32" fill="none">
  <style>
    @keyframes pulse { 0%, 100% { opacity: 0.35; r: 2.6px; } 50% { opacity: 1; r: 3.6px; } }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .p1 { animation: pulse 2.4s ease-in-out infinite; }
    .p2 { animation: pulse 2.4s ease-in-out 0.8s infinite; }
    .p3 { animation: pulse 2.4s ease-in-out 1.6s infinite; }
    .arc { animation: flow 1.8s linear infinite; }
  </style>
  <path d="M10 16 C10 6, 36 6, 36 16" stroke="#7C3AED" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M15 18 C15 11, 31 11, 31 18" stroke="#2563EB" stroke-width="2.1" stroke-linecap="round"/>
  <line x1="8" y1="21" x2="38" y2="21" stroke="#0D9488" stroke-width="2" stroke-dasharray="3 2"/>
  <rect x="10" y="25" width="26" height="4.5" rx="2" fill="#0D9488" fill-opacity="0.22" stroke="#0D9488" stroke-width="1.2"/>
  <path class="arc" d="M40 26 C54 24, 54 8, 38 7" stroke="#D97706" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
  <circle class="p1" cx="23" cy="7" r="3" fill="#7C3AED"/>
  <circle class="p2" cx="23" cy="21" r="3" fill="#0D9488"/>
  <circle class="p3" cx="49" cy="16" r="3" fill="#D97706"/>
</svg>
